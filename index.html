<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frases para Status: bom dia, amor, fé e motivação</title>
<meta name="description" content="Frases curtas em português para o teu Status do WhatsApp. Copia ou envia com um toque.">
<style>
:root{--ink:#14183A;--paper:#F2F4F9}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{max-width:640px;margin:0 auto;padding:22px 16px 6px}
h1{font:700 1.7rem/1.15 Georgia,"Times New Roman",serif;margin:0 0 6px}
header p{margin:0;color:#4a5070}
nav{position:sticky;top:0;z-index:2;background:var(--paper);padding:10px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px;max-width:640px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--ink);background:transparent;color:var(--ink);padding:8px 14px;border-radius:999px;font:600 .9rem system-ui,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
main{max-width:640px;margin:0 auto;padding:6px 16px 36px}
h2{font:700 .95rem system-ui,sans-serif;margin:14px 0 8px}
.tile{background:var(--bg);color:var(--fg);border-radius:20px;padding:22px 20px 16px;margin:0 0 14px}
.tile .cat{margin:0 0 10px;font-size:.85rem;opacity:.85}
.tile .phrase{margin:0 0 18px;font:600 1.25rem/1.4 Georgia,"Times New Roman",serif}
.tile.today .phrase{font-size:1.5rem}
.actions{display:flex;gap:8px}
.btn{flex:1;min-height:46px;border-radius:12px;border:2px solid currentColor;background:transparent;color:inherit;font:600 .95rem system-ui,sans-serif;cursor:pointer}
.btn.main{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn:focus-visible,.chip:focus-visible{outline:3px solid currentColor;outline-offset:3px}
.c-bomdia{--bg:#FFC21A;--fg:#14183A}
.c-boanoite{--bg:#1E2A78;--fg:#fff}
.c-motivacao{--bg:#0B7A5E;--fg:#fff}
.c-amor{--bg:#C42A68;--fg:#fff}
.c-fe{--bg:#5B3FA8;--fg:#fff}
.c-amizade{--bg:#1B62DB;--fg:#fff}
.ad{margin:0 0 14px}
.ad:empty{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
footer{max-width:640px;margin:0 auto;padding:0 16px 32px;color:#4a5070;font-size:.85rem}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Frases para Status</h1>
  <p>Escolhe uma frase, copia ou envia no WhatsApp com um toque.</p>
</header>
<nav aria-label="Categorias"><div class="chips" id="chips"></div></nav>
<main>
  <h2>Frase do dia</h2>
  <div id="today"></div>
  <!-- ANÚNCIO TOPO: cola aqui o código da rede de anúncios dentro deste aside -->
  <aside class="ad" id="ad-topo" aria-label="Publicidade"></aside>
  <h2 id="listTitle">Todas as frases</h2>
  <div id="list"></div>
</main>
<footer>
  <!-- Adiciona aqui o link para a página de Política de Privacidade (as redes de anúncios pedem). -->
  <p>Frases originais. Podes copiar e partilhar à vontade.</p>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
var N={bomdia:"Bom dia",boanoite:"Boa noite",motivacao:"Motivação",amor:"Amor",fe:"Fé",amizade:"Amizade"};
var D=[
["bomdia","Acordaste hoje. Já é um motivo para tentar de novo."],
["bomdia","Bom dia! Que o teu dia tenha mais sorrisos do que pressa."],
["bomdia","Hoje é uma página em branco. Escreve algo de que te orgulhes."],
["bomdia","Levanta-te com calma, mas decide com coragem."],
["bomdia","Bom dia. Que o que pesou ontem fique ontem."],
["bomdia","Cada manhã é um convite para recomeçar sem pedir licença."],
["boanoite","Boa noite. Fizeste o que pudeste, e isso já chega."],
["boanoite","Que o descanso de hoje te devolva a força de amanhã."],
["boanoite","Fecha os olhos sem culpa. Amanhã há mais."],
["boanoite","Boa noite a quem lutou calado hoje."],
["boanoite","Dorme em paz. O que não resolveste hoje espera por ti de manhã."],
["boanoite","Que a noite leve o cansaço e deixe só a esperança."],
["motivacao","Devagar também é caminhar. Só não pares."],
["motivacao","Quem começa pequeno e continua, chega longe."],
["motivacao","Não compares o teu começo com o meio de ninguém."],
["motivacao","O esforço de hoje é a vitória que ainda ninguém viu."],
["motivacao","Cair faz parte. Ficar no chão é que é escolha."],
["motivacao","Trabalha em silêncio. Deixa os resultados fazerem barulho."],
["amor","Contigo, até o dia mais comprido passa depressa."],
["amor","Amar é escolher a mesma pessoa todos os dias."],
["amor","O teu abraço é o meu sítio favorito."],
["amor","Não preciso de muito. Preciso de ti."],
["amor","Quando te vejo sorrir, o resto do mundo desfoca."],
["amor","Amor de verdade é paz, não é confusão."],
["fe","Confia no processo. O que é teu chega no tempo certo."],
["fe","Deus não falha. Às vezes só demora mais do que gostaríamos."],
["fe","Entrega o que te pesa e caminha mais leve."],
["fe","Onde a tua força acaba, a fé continua."],
["fe","Agradece hoje. A gratidão abre portas que o medo fecha."],
["fe","Tudo o que passaste te preparou para o que vem."],
["amizade","Amigo de verdade não precisa de plateia para estar presente."],
["amizade","Poucos amigos, bons amigos. Chega e sobra."],
["amizade","Obrigado por ficares quando era mais fácil ir embora."],
["amizade","Amizade é rir juntos e ficar calados sem desconforto."],
["amizade","Quem te diz a verdade com carinho é amigo para a vida."],
["amizade","Há pessoas que são casa. Tu és uma delas."]
];
var cat="todas";
function tile(i,extra){var d=D[i];return '<article class="tile c-'+d[0]+(extra||"")+'"><p class="cat">'+N[d[0]]+'</p><p class="phrase">'+d[1]+'</p><div class="actions"><button class="btn main" data-a="wa" data-i="'+i+'">Enviar no WhatsApp</button><button class="btn" data-a="copy" data-i="'+i+'">Copiar</button></div></article>'}
function chips(){var h='<button class="chip" data-c="todas" aria-pressed="'+(cat==="todas")+'">Todas</button>';for(var k in N){h+='<button class="chip" data-c="'+k+'" aria-pressed="'+(cat===k)+'">'+N[k]+'</button>'}document.getElementById("chips").innerHTML=h}
function list(){var h="",n=0;for(var i=0;i<D.length;i++){if(cat!=="todas"&&D[i][0]!==cat)continue;h+=tile(i);n++;
/* ANÚNCIO NO MEIO: cola o código da rede dentro destes aside */
if(n%5===0)h+='<aside class="ad" aria-label="Publicidade"></aside>'}
document.getElementById("list").innerHTML=h;
document.getElementById("listTitle").textContent=cat==="todas"?"Todas as frases":"Frases de "+N[cat].toLowerCase()}
function init(){chips();list();document.getElementById("today").innerHTML=tile(Math.floor(Date.now()/864e5)%D.length," today")}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.className="toast show";clearTimeout(toast.t);toast.t=setTimeout(function(){t.className="toast"},1800)}
function text(i){var t=D[i][1];if(location.protocol.indexOf("http")===0)t+="\n\n"+location.origin;return t}
function copy(s){if(navigator.clipboard&&window.isSecureContext){return navigator.clipboard.writeText(s)}return new Promise(function(ok,no){var a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();try{document.execCommand("copy")?ok():no()}catch(e){no()}document.body.removeChild(a)})}
document.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
if(b.dataset.c){cat=b.dataset.c;chips();list();return}
var i=b.dataset.i;if(i===undefined)return;
if(b.dataset.a==="copy"){copy(text(i)).then(function(){toast("Copiado")},function(){toast("Não foi possível copiar")})}
else{window.open("https://wa.me/?text="+encodeURIComponent(text(i)),"_blank")}});
init();
</script>
</body>
</html>
